[package]
name = "spool"
version = "0.9.0"
edition = "2021"
description = "Filme, Serien und Musik geprüft in die Plex-Bibliothek übertragen"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kern = { path = "../kern" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
