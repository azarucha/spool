name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo test -p kern --locked
      - name: Build installer
        working-directory: app
        run: npx --yes @tauri-apps/cli@2.12.6 build -- --locked
      - name: Draft release
        shell: bash
        run: |
          cd target/release/bundle/nsis
          sha256sum *-setup.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *-setup.exe SHA256SUMS.txt --draft --prerelease --verify-tag --title "Spool $GITHUB_REF_NAME" --generate-notes
